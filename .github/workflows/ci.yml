name : AgencyOS CI

on:
   push:
        branches:
          - main


   pull_request:
        branches:
          - main      

jobs:
   verify:
        name: Verify AgencyOS
        runs-on: windows-latest
        steps:
           - name: Checkout repository
             uses: actions/checkout@v4
           - name: Setup Node.js
             uses: actions/setup-node@v4  
             with: 
               node-version: '22'

           - name: Check Node.js version
             run: |
               node --version
               npm --version   

           - name: Install Auth Service dependencies
             working-directory: backend/auth-service
             run: npm ci    

           - name: Build Auth service
             working-directory: backend/auth-service
             run: npm run build  

           - name: Install React Shell dependencies
             working-directory: frontend/shell
             run: npm ci

           - name: Build React Shell
             working-directory: frontend/shell
             run: npm run build

           - name: Install Auth MFE dependencies
             working-directory: frontend/auth-mfe
             run: npm ci

           - name: Build Auth MFE
             working-directory: frontend/auth-mfe
             run: npm run build

  
           - name: Show working directory
             run: pwd

           - name: List project files
             run: dir  
           - name: Verify backend
             run: dir backend/auth-service
           - name: Verify Shell
             run: dir frontend/shell
           - name: Verify Auth MFE
             run: dir frontend/auth-mfe
           - name: Finish
             run: echo "AgencyOS CI verification completed"


   docker-build:

        name: Build Auth Service Docker Image
        needs: verify
        runs-on: ubuntu-latest

        steps:
           - name: Checkout repository
             uses: actions/checkout@v4
           - name: Build Auth Service image
             run: docker build -t agencyos-auth-service:ci ./backend/auth-service
