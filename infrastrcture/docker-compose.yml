# # docker-compose.yml  is a yaml configuration file that tells docker how to create and run one or more conatiners

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: agencyos-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listener used for broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single broker: replication factor must be 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Single-broker transaction log replication
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      # Minimum in-sync replicas for transaction logs
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

# docker compose -f infrastrcture/docker-compose.yml up -d

# docker compose — Manage containers using our YAML file.

# -f — Specify the file path.

# up — Create and start Kafka.

# -d — Run Kafka in the background.
