name : AgencyOS CI

on:
   push:
        branches:
          - main


   pull_request:
        branches:
          - main      

jobs:
   verify:
        name: Verify AgencyOS
        runs-on: windows-latest
        steps:
           - name: Checkout repository
             uses: actions/checkout@v4
           - name: Setup Node.js
             uses: actions/setup-node@v4  
             with: 
               node-version: '22'

           - name: Check Node.js version
             run: |
               node --version
               npm --version   
           - name: Show working directory
             run: pwd

           - name: List project files
             run: dir  
           - name: Verify backend
             run: dir backend/auth-service
           - name: Verify Shell
             run: dir frontend/shell
           - name: Verify Auth MFE
             run: dir frontend/auth-mfe
           - name: Finish
             run: echo "AgencyOS CI verification completed"
