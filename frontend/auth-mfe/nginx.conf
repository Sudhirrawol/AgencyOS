server{
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

      location / {
        add_header Access-Control-Allow-Origin "http://localhost:5000" always;
        try_files $uri $uri/ /index.html;
    }
      location /assets/ {
        add_header Access-Control-Allow-Origin "http://localhost:5000" always;
        try_files $uri =404;
    }
}